<!DOCTYPE html>
<html>
<head>
<title>Random Joke Generator</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Arial', sans-serif;
  padding: 20px;
}

.container {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  padding: 40px;
  max-width: 600px;
  width: 100%;
  text-align: center;
  animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  color: #333;
  margin-bottom: 30px;
  font-size: 2.5em;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.joke-box {
  background: #f8f9fa;
  border-left: 5px solid #667eea;
  padding: 25px;
  margin: 30px 0;
  border-radius: 10px;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.joke-text {
  font-size: 1.2em;
  color: #555;
  line-height: 1.6;
  font-style: italic;
}

.loading {
  display: none;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

.button-group {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  padding: 12px 30px;
  font-size: 1em;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: bold;
}

#getJokeBtn {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  flex: 1;
  min-width: 150px;
}

#getJokeBtn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
}

#getJokeBtn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#copyBtn {
  background: #4caf50;
  color: white;
  min-width: 150px;
}

#copyBtn:hover {
  background: #45a049;
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
}

.joke-category {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.category-btn {
  padding: 8px 15px;
  background: #e0e0e0;
  color: #333;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9em;
}

.category-btn.active {
  background: #667eea;
  color: white;
}

.category-btn:hover {
  background: #667eea;
  color: white;
  transform: translateY(-2px);
}

.info-text {
  color: #999;
  font-size: 0.9em;
  margin-top: 20px;
}

.success-message {
  background: #4caf50;
  color: white;
  padding: 10px;
  border-radius: 5px;
  margin-top: 10px;
  display: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>😂 Joke Generator 😂</h1>
  
  <div class="joke-category">
    <button class="category-btn active" onclick="setCategory('any')">All</button>
    <button class="category-btn" onclick="setCategory('general')">General</button>
    <button class="category-btn" onclick="setCategory('programming')">Programming</button>
    <button class="category-btn" onclick="setCategory('knock-knock')">Knock-Knock</button>
  </div>
  
  <div class="joke-box">
    <div class="joke-text" id="jokeText">Click the button to get a joke!</div>
    <div class="loading" id="loading">⏳</div>
  </div>
  
  <div class="button-group">
    <button id="getJokeBtn" onclick="getJoke()">Get a Joke</button>
    <button id="copyBtn" onclick="copyJoke()">📋 Copy</button>
  </div>
  
  <div class="success-message" id="successMessage">✓ Copied to clipboard!</div>
  <p class="info-text">Powered by JokeAPI</p>
</div>

<script>
let currentJoke = '';
let selectedCategory = 'any';

function setCategory(category) {
  selectedCategory = category;
  
  // Update active button
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  getJoke();
}

function getJoke() {
  const jokeText = document.getElementById('jokeText');
  const loading = document.getElementById('loading');
  const btn = document.getElementById('getJokeBtn');
  
  // Show loading state
  loading.style.display = 'inline';
  btn.disabled = true;
  jokeText.textContent = '';
  
  // Build API URL
  let apiUrl = 'https://v2.jokeapi.dev/joke/';
  
  if (selectedCategory === 'any') {
    apiUrl += 'Any';
  } else if (selectedCategory === 'general') {
    apiUrl += 'General';
  } else if (selectedCategory === 'programming') {
    apiUrl += 'Programming';
  } else if (selectedCategory === 'knock-knock') {
    apiUrl += 'Knock-Knock';
  }
  
  apiUrl += '?type=single';
  
  // Fetch joke from API
  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        currentJoke = '😅 Oops! Could not fetch a joke. Try again!';
      } else {
        currentJoke = data.joke;
      }
      
      jokeText.textContent = currentJoke;
      loading.style.display = 'none';
      btn.disabled = false;
    })
    .catch(error => {
      console.error('Error:', error);
      currentJoke = '😅 Oops! Something went wrong. Check your internet connection and try again!';
      jokeText.textContent = currentJoke;
      loading.style.display = 'none';
      btn.disabled = false;
    });
}

function copyJoke() {
  if (!currentJoke) {
    alert('No joke to copy! Get a joke first.');
    return;
  }
  
  navigator.clipboard.writeText(currentJoke).then(() => {
    const successMsg = document.getElementById('successMessage');
    successMsg.style.display = 'block';
    setTimeout(() => {
      successMsg.style.display = 'none';
    }, 2000);
  }).catch(() => {
    alert('Failed to copy. Please try again.');
  });
}

// Get a joke when page loads
window.addEventListener('load', getJoke);
</script>

</body>
</html>
